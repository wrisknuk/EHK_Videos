<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Енк.ру</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(45deg, #3a3d52, #4e5166);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Эффекты при наведении для каждой кнопки */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #1e1e2f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Енк.ру</h1>
        <div class="btn-list">
            <!-- Замените '#' в href=" " на ваши реальные ссылки -->
            <a href="https://t.me/fsuhdjd" class="btn">🎬 Набор аниматора и монтаж</a>
            <a href="https://t.me/fsuhdjd" class="btn">🆘 Служба поддержки</a>
            <a href="https://t.me/fsuhdjd" class="btn">🤝 Сотрудничество</a>
        </div>
    </div>

</body>
</html>
